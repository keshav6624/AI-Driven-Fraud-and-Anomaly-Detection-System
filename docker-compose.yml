version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mplad_sentinel
      POSTGRES_USER: mplad
      POSTGRES_PASSWORD: mplad_secret_change_me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mplad -d mplad_sentinel"]
      interval: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://mplad:mplad_secret_change_me@db:5432/mplad_sentinel
      JWT_SECRET: change-me-in-production-to-a-random-string
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      SEED_ADMIN_PASSWORD: admin-changeMe
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  pgdata:
